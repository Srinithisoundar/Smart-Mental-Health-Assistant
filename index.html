<!DOCTYPE html>
<html>
<head>
    <title>Mental Health Assistant</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        #chat { width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; }
        .msg { margin: 10px 0; }
        .user { text-align: right; }
        .bot { text-align: left; color: blue; }
    </style>
</head>
<body>

<div id="chat">
    <h3>Mental Health Assistant</h3>
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
    let input = document.getElementById("input");
    let text = input.value;

    let messages = document.getElementById("messages");

    messages.innerHTML += `<div class='msg user'>${text}</div>`;

    let res = await fetch("http://127.0.0.1:5000/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
    });

    let data = await res.json();

    messages.innerHTML += `
        <div class='msg bot'>
            ${data.response} <br/>
            <small>Emotion: ${data.emotion} | State: ${data.mental_state}</small>
        </div>
    `;

    input.value = "";
}
</script>

</body>
</html>
